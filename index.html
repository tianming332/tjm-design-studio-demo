<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TJM 图形设计工作台</title>
    <link rel="icon" type="image/png" href="%BASE_URL%brand/tjm-ai-logo.png" />
    <script>
      // Resolve the saved preference before the first styled frame.
      (() => {
        let mode = 'system';
        try { const p = JSON.parse(localStorage.getItem('tjm.appearance.v1') || '{}'); if (p && ['system', 'light', 'dark'].includes(p.theme)) mode = p.theme; } catch {}
        const dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
